name: check-final
version: 0.4.0
description: Validate three cross judgments, matching draft/evidence identities, declared factual support,
  and five gate results. Returns accepted and reasons; does not prove empirical truth.
input_schema:
  type: object
  properties:
    cross: &id001
      type: object
    judgments:
      type: array
      items: *id001
    gates: *id001
  required:
  - cross
  - judgments
  - gates
  additionalProperties: false
output_schema:
  type: object
implementation:
  type: script
  path: scripts/check-final.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
  cost: none
