name: document-write
version: 0.4.0
description: Host-bound author-only write to authorized document output paths. Host enforces scope and
  approvals; no executable is bundled.
input_schema:
  type: object
  properties:
    path:
      type: string
    content:
      type: string
  required:
  - path
  - content
annotations:
  read_only: false
  idempotent: true
  cost: none
