name: Validate portable agents
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate with pinned OpenGAP CLI
        shell: bash
        run: |
          npx --yes --package @open-gitagent/opengap@0.5.0 opengap validate --dir . --compliance
          for agent in agents/*; do
            npx --yes --package @open-gitagent/opengap@0.5.0 opengap validate --dir "$agent"
          done
